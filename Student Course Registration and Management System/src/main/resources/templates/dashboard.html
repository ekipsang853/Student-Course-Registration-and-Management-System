<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Student System</a>
        <div>
            <a href="/students" class="btn btn-light btn-sm">Students</a>
            <a href="/courses" class="btn btn-light btn-sm">Courses</a>
            <a href="/registrations" class="btn btn-light btn-sm">Registrations</a>
        </div>
    </div>
</nav>

<main class="container py-4">

<h1 class="mb-4 text-center">Dashboard</h1>

<div class="row g-4 text-center">

    <div class="col-md-4">
        <div class="card bg-primary text-white border-0 shadow-sm p-3">
            <h4>Total Students</h4>
            <h2 th:text="${studentCount}"></h2>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card bg-success text-white border-0 shadow-sm p-3">
            <h4>Total Courses</h4>
            <h2 th:text="${courseCount}"></h2>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card bg-warning text-dark border-0 shadow-sm p-3">
            <h4>Total Registrations</h4>
            <h2 th:text="${registrationCount}"></h2>
        </div>
    </div>

</div>

<div class="text-center mt-5">
    <a href="/students" class="btn btn-primary me-2">Manage Students</a>
    <a href="/courses" class="btn btn-success me-2">Manage Courses</a>
    <a href="/registrations" class="btn btn-warning">Manage Registrations</a>
</div>

</main>

</body>
</html>

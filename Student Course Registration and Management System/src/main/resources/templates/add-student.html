<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Student</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Student System</a>
        <div>
            <a href="/students" class="btn btn-light btn-sm">Students</a>
            <a href="/courses" class="btn btn-light btn-sm">Courses</a>
            <a href="/registrations" class="btn btn-light btn-sm">Registrations</a>
        </div>
    </div>
</nav>

<main class="container py-2">

<div class="row justify-content-center">
<div class="col-lg-8">
<div class="card shadow-sm border-0">
<div class="card-body p-4">

<h2>Add Student</h2>

<form th:action="@{/students/save}" th:object="${student}" method="post">

    <div class="mb-3">
        <label>Name</label>
        <input type="text" th:field="*{name}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label>Email</label>
        <input type="email" th:field="*{email}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label>Program</label>
        <input type="text" th:field="*{program}" class="form-control">
    </div>

    <div class="mb-3">
        <label>Year</label>
        <input type="number" th:field="*{year}" class="form-control">
    </div>

    <button type="submit" class="btn btn-success">Save</button>
    <a href="/students" class="btn btn-secondary">Back</a>

</form>

</div>
</div>
</div>
</div>

</main>

</body>
</html>

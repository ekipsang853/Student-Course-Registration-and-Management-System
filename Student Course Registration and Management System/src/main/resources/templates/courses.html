<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Courses</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Student System</a>
        <div>
            <a href="/students" class="btn btn-light btn-sm">Students</a>
            <a href="/courses" class="btn btn-light btn-sm">Courses</a>
            <a href="/registrations" class="btn btn-light btn-sm">Registrations</a>
        </div>
    </div>
</nav>

<main class="container py-2">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Course List</h2>
    <a href="/courses/new" class="btn btn-primary">Add New Course</a>
</div>

<div class="card shadow-sm border-0">
<div class="card-body">
<table class="table table-bordered table-striped mb-0">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Course Name</th>
            <th>Course Code</th>
            <th>Lecturer</th>
            <th>Credits</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="course : ${courses}">
            <td th:text="${course.id}"></td>
            <td th:text="${course.courseName}"></td>
            <td th:text="${course.courseCode}"></td>
            <td th:text="${course.lecturer}"></td>
            <td th:text="${course.credits}"></td>
        </tr>
    </tbody>
</table>
</div>
</div>

</main>

</body>
</html>

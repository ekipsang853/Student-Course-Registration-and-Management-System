<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registrations</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Student System</a>
        <div>
            <a href="/students" class="btn btn-light btn-sm">Students</a>
            <a href="/courses" class="btn btn-light btn-sm">Courses</a>
            <a href="/registrations" class="btn btn-light btn-sm">Registrations</a>
        </div>
    </div>
</nav>

<main class="container py-2">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Course Registrations</h2>
    <a href="/registrations/new" class="btn btn-primary">Register Course</a>
</div>

<div class="card shadow-sm border-0">
<div class="card-body">
<table class="table table-bordered mb-0">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Student</th>
            <th>Course</th>
            <th>Semester</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="reg : ${registrations}">
            <td th:text="${reg.id}"></td>
            <td th:text="${reg.student.name}"></td>
            <td th:text="${reg.course.courseName}"></td>
            <td th:text="${reg.semester}"></td>
            <td>
                <a th:href="@{/registrations/delete/{id}(id=${reg.id})}"
                   class="btn btn-danger btn-sm">Drop</a>
            </td>
        </tr>
    </tbody>
</table>
</div>
</div>

</main>

</body>
</html>

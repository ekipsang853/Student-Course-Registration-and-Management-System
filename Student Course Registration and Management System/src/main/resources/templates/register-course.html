<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register Course</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Student System</a>
        <div>
            <a href="/students" class="btn btn-light btn-sm">Students</a>
            <a href="/courses" class="btn btn-light btn-sm">Courses</a>
            <a href="/registrations" class="btn btn-light btn-sm">Registrations</a>
        </div>
    </div>
</nav>

<main class="container py-2">

<div class="row justify-content-center">
<div class="col-lg-8">
<div class="card shadow-sm border-0">
<div class="card-body p-4">

<h2>Register for Course</h2>

<form th:action="@{/registrations/save}" method="post">

    <div class="mb-3">
        <label>Select Student</label>
        <select name="studentId" class="form-control" required>
            <option value="">-- Select Student --</option>
            <option th:each="student : ${students}"
                    th:value="${student.id}"
                    th:text="${student.name}">
            </option>
        </select>
    </div>

    <div class="mb-3">
        <label>Select Course</label>
        <select name="courseId" class="form-control" required>
            <option value="">-- Select Course --</option>
            <option th:each="course : ${courses}"
                    th:value="${course.id}"
                    th:text="${course.courseName}">
            </option>
        </select>
    </div>

    <div class="mb-3">
        <label>Semester</label>
        <input type="text" name="semester" class="form-control" placeholder="e.g. Semester 1" required>
    </div>

    <button type="submit" class="btn btn-success">Register</button>
    <a href="/registrations" class="btn btn-secondary">Back</a>

</form>

</div>
</div>
</div>
</div>

</main>

</body>
</html>

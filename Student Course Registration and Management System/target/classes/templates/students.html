<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Students</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Student System</a>
        <div>
            <a href="/students" class="btn btn-light btn-sm">Students</a>
            <a href="/courses" class="btn btn-light btn-sm">Courses</a>
            <a href="/registrations" class="btn btn-light btn-sm">Registrations</a>
        </div>
    </div>
</nav>

<main class="container py-2">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Student List</h2>
    <a href="/students/new" class="btn btn-primary">Add New Student</a>
</div>

<div class="card shadow-sm border-0">
<div class="card-body">
<table class="table table-bordered table-striped mb-0">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Program</th>
            <th>Year</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.id}"></td>
            <td th:text="${student.name}"></td>
            <td th:text="${student.email}"></td>
            <td th:text="${student.program}"></td>
            <td th:text="${student.year}"></td>
            <td>
                <a th:href="@{/students/delete/{id}(id=${student.id})}"
                   class="btn btn-danger btn-sm">Delete</a>
                <a th:href="@{/students/edit/{id}(id=${student.id})}"
                   class="btn btn-warning btn-sm">Edit</a>
            </td>
        </tr>
    </tbody>
</table>
</div>
</div>

</main>

</body>
</html>
